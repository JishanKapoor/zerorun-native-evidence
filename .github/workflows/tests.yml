name: Software validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  installed-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build==1.3.0 pytest==8.4.2 setuptools==80.9.0 wheel==0.45.1
      - run: python -m build --no-isolation
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m pytest tests -q
      - run: zerorun --version
      - run: python research/verify_observations.py
      - run: python research/native_consumer.py
