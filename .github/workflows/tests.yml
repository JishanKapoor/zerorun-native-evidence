name: Software validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit or tag to validate
        required: false
        default: ''
permissions:
  contents: read
jobs:
  installed-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build==1.3.0 pytest==8.4.2 setuptools==80.9.0 wheel==0.45.1
      - run: python -m build --no-isolation
      - run: python validation/package_checks.py dist
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m pytest tests -q
      - run: python validation/boundary_campaign.py
      - run: python validation/extension_boundary_campaign.py
      - run: python validation/semantic_fault_campaign.py
      - run: python -m build --no-isolation --outdir extension-dist validation/example_extension
      - run: python -m pip install --no-deps extension-dist/*.whl
      - run: python validation/verify_extension_install.py
      - run: zerorun --version
      - run: python research/verify_observations.py
      - run: python research/native_consumer.py
      - run: python validation/verify_handoffs.py research/handoffs
