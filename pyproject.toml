[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "zerorun-harness"
version = "0.3.0"
description = "Provenance-preserving replay checks for bounded native evaluator observations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE.txt", "Licence.txt", "src/zerorun_harness/_vendor/LICENSE.txt", "src/zerorun_harness/_vendor/NOTICE.txt"]
authors = [{name = "Jishan Kapoor"}]
dependencies = []

[project.scripts]
zerorun = "zerorun_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zerorun_harness = ["resources/*.json", "_vendor/LICENSE.txt", "_vendor/NOTICE.txt", "examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
